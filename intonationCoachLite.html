<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<title>Intonation Coach Lite</title>
		<link rel="shortcut icon" href="./intonationCoachLite/Kiwi-bird-green.png">
		<style>
body {
	font-family: sans-serif;
	margin: 20px;
	background: #121212;
	color: #fff;
}
.container {
	max-width: 100%;
	margin: auto;
}

/* 1行目: タイトル + status（右詰め） */
.title-row {
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	flex-wrap: wrap;
	gap: 8px 16px;
	margin-bottom: 12px;
}
.title-row h2 {
	margin: 0;
}
.title-row h2 .subtitle {
	font-size: 0.55em;
	font-weight: normal;
	color: #aaa;
	margin-left: 8px;
}
#status {
	font-size: 0.9em;
	color: #aaa;
	text-align: right;
	white-space: nowrap;
}

/* 2・3行目: ファイル / マイクのコントロール（列を揃える） */
.control-grid {
	display: grid;
	grid-template-columns: auto auto auto auto;
	column-gap: 18px;
	row-gap: 10px;
	align-items: center;
	margin-bottom: 18px;
}
.pitch-controls {
	display: flex;
	align-items: center;
	gap: 8px;
	font-size: 0.9em;
	color: #aaa;
	white-space: nowrap;
}
.pitch-controls label {
	cursor: pointer;
	user-select: none;
}
.pitch-controls label:hover {
	color: #fff;
	text-decoration: underline;
}
.speed-controls {
	display: flex;
	align-items: center;
	gap: 8px;
	font-size: 0.9em;
	color: #aaa;
	white-space: nowrap;
}
.speed-controls span {
	min-width: 3.6em;
	display: inline-block;
}
.swatch {
	width: 10px;
	height: 10px;
	border-radius: 50%;
	display: inline-block;
	flex-shrink: 0;
}
.swatch-file { background: #4af; }
.swatch-mic { background: #fa4; }

button, input[type="file"] {
	padding: 8px 12px;
	background: #333;
	color: #fff;
	border: 1px solid #555;
	cursor: pointer;
	border-radius: 4px;
}
button:hover {
	background: #444;
}
button:disabled, input:disabled {
	opacity: 0.5;
	cursor: not-allowed;
}
input[type="range"] {
	cursor: pointer;
}

/* 4行目: チャート + 右端の録音ボタン */
.chart-row {
	display: flex;
	align-items: stretch;
	gap: 10px;
	margin-bottom: 6px;
}
#pitchChartScrollContainer {
	flex: 1 1 auto;
	min-width: 0;
	overflow-x: auto;
	overflow-y: hidden;
	border: 1px solid #444;
	background: #1e1e1e;
	height: 280px;
	/* スマホ等で扱いやすいよう、太めのスクロールバーにする */
	scrollbar-width: auto;
	scrollbar-color: #777 #2a2a2a;
}
#pitchChartScrollContainer::-webkit-scrollbar {
	height: 20px;
}
#pitchChartScrollContainer::-webkit-scrollbar-track {
	background: #2a2a2a;
}
#pitchChartScrollContainer::-webkit-scrollbar-thumb {
	background: #777;
	border-radius: 10px;
	border: 4px solid #2a2a2a;
}
#pitchChartScrollContainer::-webkit-scrollbar-thumb:hover {
	background: #999;
}
#pitchPlotWrapper {
	position: relative;
	height: 280px;
}
#pitchCanvas, #cursorCanvas {
	position: absolute;
	top: 0;
	left: 0;
	display: block;
	height: 280px;
}
#pitchCanvas {
	touch-action: none;		/* マイク録音位置のドラッグ操作中にスクロール等が起きないように */
	user-select: none;
	cursor: default;
}
#cursorCanvas {
	/* カーソル専用の透過レイヤー。クリック/ドラッグは下のpitchCanvasに通す */
	pointer-events: none;
}
.record-btn {
	flex: 0 0 auto;
	width: 92px;
	display: flex;
	align-items: center;
	justify-content: center;
	text-align: center;
	line-height: 1.4;
	font-size: 0.95em;
	touch-action: none;		/* 長押し中にスマホでスクロール等が起きないように */
	user-select: none;
}
.record-btn.active {
	background: #a33;
	border-color: #d55;
	color: #fff;
}

.hint {
	font-size: 0.8em;
	color: #777;
	margin-bottom: 60px;
}
.footer {
	position: fixed;
	bottom: 0;
	font-size: 0.8em;
	color: lightGray;
}
		</style>
	</head>
	<body>
		<div class="container">
			<!-- 1行目: タイトル + status -->
			<div class="title-row">
				<h2>Intonation Coach Lite</h2>
				<div id="status">モデルを初期化中...</div>
			</div>

			<!-- 2・3行目: ファイル / マイクのコントロール -->
			<div class="control-grid">
				<!-- ファイル -->
				<input type="file" id="audioFile" accept="audio/*">
				<div class="pitch-controls">
					<span class="swatch swatch-file"></span>
					<label id="confLabel" for="confThreshold" title="クリックしてデフォルト値(0.90)に戻す">信頼度 ≧: </label>
					<span id="confValue"></span>
					<input type="range" id="confThreshold" min="0" max="0.99" step="0.01" value="0.90">
				</div>
				<button id="playPauseBtn" disabled>💿再生</button>
				<div class="speed-controls">
					<label id="speedLabel" for="fileSpeedSlider">速度:</label>
					<input type="range" id="fileSpeedSlider" min="0.2" max="1.0" step="0.05" value="1.0" disabled>
					<span id="fileSpeedValue">1.00x</span>
				</div>

				<!-- マイク（列は上のファイル行に揃える） -->
				<div></div>
				<div class="pitch-controls">
					<span class="swatch swatch-mic"></span>
					<label id="confLabelMic" for="confThresholdMic" title="クリックしてデフォルト値(0.90)に戻す">信頼度 ≧: </label>
					<span id="confValueMic"></span>
					<input type="range" id="confThresholdMic" min="0" max="0.99" step="0.01" value="0.90">
				</div>
				<button id="micPlayPauseBtn" disabled>🎤再生</button>
				<div class="speed-controls">
					<label id="speedLabelMic" for="micSpeedSlider">速度:</label>
					<input type="range" id="micSpeedSlider" min="0.2" max="1.0" step="0.05" value="1.0" disabled>
					<span id="micSpeedValue">1.00x</span>
				</div>
			</div>

			<!-- 4行目: チャート + 録音ボタン -->
			<div class="chart-row">
				<div id="pitchChartScrollContainer">
					<div id="pitchPlotWrapper">
						<canvas id="pitchCanvas"></canvas>
						<canvas id="cursorCanvas"></canvas>
					</div>
				</div>
				<button id="recordBtn" class="record-btn" disabled>🔴</button>
			</div>

			<!-- 5行目: ヒントメッセージ -->
			<div class="hint" id="hintText">※ マイク録音の波形（オレンジ）は左右にドラッグして位置を調整できます（ダブルクリックでリセット）。</div>

			<!-- 最下行: footer -->
			<footer class="footer" id="footer">SwiftF0 by Lars Nieradzik (MIT License) · 音声はブラウザ内でのみ処理され、外部へは送信されません。</footer>

			<!-- 再生用のaudio要素（iOS/iPadOS等での再生安定性のため、DOMに実在させておく） -->
			<audio id="filePlayerElement" preload="auto"></audio>
			<audio id="micPlayerElement" preload="auto"></audio>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
		<script type="module" src="./intonationCoachLite/intonationCoachLite.js"></script>
	</body>
</html>

<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Intonation Coach/RAPT</title>
		<link rel="shortcut icon" href="./intonationCoachRAPT/Kiwi-bird-blue.png">
		<link rel="stylesheet" href="./intonationCoachRAPT/intonationCoachRAPT.css">
	</head>
	<body>

		<div class="app">

			<div class="panel">
				<div class="chart-scroll" id="chartScroll">
					<div class="chart-spacer" id="chartSpacer"></div>
					<div class="chart-stack" id="chartStack">
						<canvas id="chart"></canvas>
						<canvas id="chartOverlay"></canvas>
						<canvas id="playhead"></canvas>
					</div>
				</div>
				<div class="custom-scrollbar-track" id="customScrollbarTrack">
					<div class="custom-scrollbar-thumb" id="customScrollbarThumb"></div>
				</div>
				<div class="legend">
					<span>モデル音声（弱→強）</span>
					<span class="legend-model-gradient"></span>&nbsp;
					<span>録音音声（弱→強）</span>
					<span class="legend-mic-gradient"></span>&nbsp;
					<input type="number" id="lowFreq" value="70" min="40" max="250" step="5">Hz 〜<input type="number" id="highFreq" value="350" min="150" max="600" step="5">Hz
				</div>
			</div>
			<div class="controls">
				<table>
					<tr>
						<td>
							<label for="audioFileInput" class="file-button" id="fileButtonLabel">ファイル入力</label>
							<input type="file" id="audioFileInput" accept="audio/*" hidden>
						</td>
						<td>
							<button id="filePlayBtn" class="play-btn" disabled>ファイルを再生</button>
						</td>
						<td>
							<div class="model-rate-control">
								<label for="fileRate">速度</label>
								<input type="range" id="fileRate" min="0.2" max="1.0" step="0.05" value="1">
								<span id="fileRateValue">1.00x</span>
							</div>
						</td>
						<td>
							<button id="fileCsvBtn" class="csv-btn" hidden disabled>CSVを保存</button>
						</td>
						<td>
							<span class="readout" id="status">録音するか、音声ファイルを選択してください</span>
						</td>
					</tr>
					<tr>
						<td>
							<button id="recordBtn">録音開始</button>
						</td>
						<td>
							<button id="micPlayBtn" class="play-btn" disabled>録音音声を再生</button>
						</td>
						<td>
							<div class="mic-rate-control">
								<label for="micRate">速度</label>
								<input type="range" id="micRate" min="0.2" max="1.0" step="0.05" value="1">
								<span id="micRateValue">1.00x</span>
							</div>
						</td>
						<td>
							<button id="micCsvBtn" class="csv-btn" hidden disabled>CSVを保存</button>
						</td>
						<td>
						</td>
					</tr>
				</table>

			</div>

			<footer class="footer" id="footer">
				<h1>Intonation Coach/RAPT</h1>
				・The RAPT algorithm was ported from SPTK (ver. 3.11) using Claude AI.<br> 
				・音声はブラウザ内でのみ処理され、外部へは送信されません。
			</footer>
		</div>

		<script src="./intonationCoachRAPT/ModelColor.js"></script>
		<script src="./intonationCoachRAPT/MicColor.js"></script>
		<script src="./intonationCoachRAPT/RAPTclass.js"></script>
		<script src="./intonationCoachRAPT/intonationCoachRAPT.js"></script>

	</body>
</html>
